<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101e2f">
  <title>国税徴収法 Knowledge Lab | 理解・暗記・過去問</title>
  <meta name="description" content="国税徴収法の理論・復習・記述演習・過去問を一元管理する個人学習アプリ">
  <link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="app-icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="appShell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-logo">徴</span><div><b>国税徴収法</b><small>KNOWLEDGE LAB</small></div></div>
      <p class="side-label">LEARN</p>
      <nav id="nav">
        <button class="navitem active" data-page="home"><span class="ni">▦</span>ダッシュボード</button>
        <button class="navitem" data-page="review"><span class="ni">▣</span>今日の復習 <span id="navDue" class="count-pill">0</span></button>
        <button class="navitem" data-page="theory"><span class="ni">▤</span>理論ライブラリ</button>
        <button class="navitem" data-page="practice"><span class="ni">✎</span>論点別演習</button>
        <button class="navitem" data-page="past"><span class="ni">▧</span>過去問・模擬試験</button>
        <button class="navitem" data-page="materials"><span class="ni">▧</span>画像教材</button>
      </nav>
      <p class="side-label">TOOLS</p>
      <nav><button class="navitem" data-page="analytics"><span class="ni">◫</span>学習分析</button><button class="navitem" data-page="data"><span class="ni">⇄</span>データ・設定</button></nav>
      <div class="sidebar-bottom"><div class="sync-note"><span class="small-dot"></span>この端末内に保存中</div><span class="side-footnote">自動クラウド同期なし<br>定期的にJSONバックアップを</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="top-left"><button id="mobileMenu" class="icon-btn mobile-only" aria-label="メニューを開く">☰</button><span id="crumb">学習ダッシュボード</span></div><div class="top-right"><span class="today" id="todayLabel"></span><button class="btn btn-primary btn-sm" id="quickReview">今日の復習 <span id="topDue">0</span></button></div></header>
      <main id="view" tabindex="-1"><div class="loading">学習データを読み込んでいます…</div></main>
    </div>
  </div>
  <nav class="bottom-nav" id="bottomNav" aria-label="モバイルナビゲーション"><button data-page="home"><span>▦</span>ホーム</button><button data-page="review"><span>▣</span>復習</button><button data-page="theory"><span>▤</span>理論</button><button data-page="past"><span>▧</span>過去問</button><button data-page="materials"><span>＋</span>追加</button></nav>
  <div class="modal-layer hidden" id="modalLayer" role="dialog" aria-modal="true"><div class="modal"><div id="modalBody"></div></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script><script src="app.js"></script>
</body>
</html>
